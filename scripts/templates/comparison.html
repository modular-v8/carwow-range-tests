<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original and improved dashboards</title><style>
*{box-sizing:border-box}html{overflow-y:scroll}body{margin:0;background:white;font:14px Arial,sans-serif}#stage{--split:50%;position:fixed;inset:0;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}#before{clip-path:inset(0 calc(100% - var(--split)) 0 0);z-index:2}#after{clip-path:inset(0 0 0 var(--split));z-index:1}#divider{position:absolute;left:var(--split);top:0;bottom:0;width:24px;transform:translateX(-12px);z-index:5;border:0;padding:0;cursor:col-resize;touch-action:none;background:linear-gradient(to right,transparent 10px,#C8102E 10px,#C8102E 14px,transparent 14px)}#divider:focus-visible{outline:2px solid #003b8e;outline-offset:2px}.grip{position:absolute;left:-10px;top:calc(50% - 24px);width:44px;height:48px;display:grid;place-items:center;background:white;border:2px solid #C8102E;color:#111;font-size:22px}.label{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;white-space:nowrap;background:#fff;color:#111;padding:16px 8px;font:14px/1.3 Arial,sans-serif;writing-mode:vertical-rl;pointer-events:none;border:1px solid #ddd}.original{right:38px;transform:translateY(-50%) rotate(180deg)}.improved{left:38px}.dragging iframe{pointer-events:none}.dragging{user-select:none}@media(max-height:500px){.label{font-size:12px;padding:8px 4px}}
</style><script>
// Count the public comparison once; embedded dashboards and local previews do not track.
if (location.hostname === 'modular-v8.github.io') {
  const analytics = document.createElement('script');
  analytics.async = true;
  analytics.src = 'https://gc.zgo.at/count.js';
  analytics.dataset.goatcounter = 'https://bhavyap.goatcounter.com/count';
  document.head.appendChild(analytics);
}
</script>
</head><body><main id="stage"><iframe id="before" title="Original AI-generated dashboard" scrolling="no"></iframe><iframe id="after" title="Improved dashboard" scrolling="no"></iframe><button id="divider" role="separator" aria-label="Reveal original or improved design. Use left and right arrows; Home and End reveal one design." aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="label original">Original AI-generated design</span><span class="grip" aria-hidden="true">↔</span><span class="label improved">Improved design and content guidance</span></button></main>
<script>
/* FRAME_DOCUMENTS */
const stage=document.querySelector('#stage'),divider=document.querySelector('#divider'),frames=[document.querySelector('#before'),document.querySelector('#after')];let split=50,relaying=false,queued=false,currentPage='overview';
function setSplit(value){split=Math.max(0,Math.min(100,Number(value)));stage.style.setProperty('--split',split+'%');divider.setAttribute('aria-valuenow',split);divider.setAttribute('aria-valuetext',split+'% original, '+(100-split)+'% improved');frames[0].inert=split===0;frames[1].inert=split===100;}
function scrollBoth(){const max=document.documentElement.scrollHeight-innerHeight,progress=max>0?scrollY/max:0;for(const f of frames){if(!f.ready)continue;const win=f.contentWindow;win.scrollTo(0,progress*Math.max(0,f.contentDocument.documentElement.scrollHeight-win.innerHeight));}}
function measure(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;const height=Math.max(innerHeight,...frames.filter(f=>f.ready).map(f=>f.contentDocument.documentElement.scrollHeight));document.body.style.height=height+'px';scrollBoth();});}
addEventListener('scroll',scrollBoth,{passive:true});addEventListener('resize',measure);
function navigate(page){if(!['overview','range','reserve','battery','explore','data','method'].includes(page))return;currentPage=page;for(const f of frames)if(f.ready)f.contentWindow.comparisonPage(page);window.scrollTo(0,0);measure();}
function wheel(e){if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();window.scrollBy(0,e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1));}
function keys(e){if(e.target.closest('input,select,textarea,button,[contenteditable="true"]'))return;const amount={PageDown:innerHeight*.85,PageUp:-innerHeight*.85,ArrowDown:48,ArrowUp:-48,' ':innerHeight*.85*(e.shiftKey?-1:1)}[e.key];if(amount!==undefined){e.preventDefault();window.scrollBy(0,amount);}else if(e.key==='Home'||e.key==='End'){e.preventDefault();window.scrollTo(0,e.key==='Home'?0:document.body.scrollHeight);}}
addEventListener('keydown',keys);
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);document.body.classList.add('dragging');});divider.addEventListener('pointermove',e=>{if(divider.hasPointerCapture(e.pointerId)){const r=stage.getBoundingClientRect();setSplit(Math.round((e.clientX-r.left)/r.width*100));}});for(const type of ['pointerup','pointercancel','lostpointercapture'])divider.addEventListener(type,()=>document.body.classList.remove('dragging'));
divider.addEventListener('keydown',e=>{const value={ArrowLeft:split-5,ArrowRight:split+5,Home:0,End:100}[e.key];if(value!==undefined){e.preventDefault();setSplit(value);}});
frames.forEach((frame,index)=>{frame.onload=()=>{if(!frame.contentWindow.comparisonPage)return;frame.ready=true;const doc=frame.contentDocument,other=frames[1-index];frame.contentWindow.comparisonPage(currentPage);
// Capture navigation before the browser resolves srcdoc-relative links to the parent file.
doc.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();e.stopPropagation();const page=a.getAttribute('href').slice(1);if(page==='content'){window.scrollTo(0,0);return;}navigate(page);}},true);
doc.addEventListener('wheel',wheel,{passive:false});doc.addEventListener('keydown',keys);let touchY=null;doc.addEventListener('touchstart',e=>{touchY=e.touches.length===1?e.touches[0].clientY:null;},{passive:true});doc.addEventListener('touchmove',e=>{if(touchY===null||e.touches.length!==1)return;const y=e.touches[0].clientY;e.preventDefault();window.scrollBy(0,touchY-y);touchY=y;},{passive:false});
for(const event of ['input','change','click'])doc.addEventListener(event,e=>{if(relaying||!other.ready)return;const el=e.target;let selector=null;if(event==='click'){const button=el.closest('button');if(!button||button.dataset.download||button.id==='export')return;const key=['unit','group','battery','sort','action'].find(k=>button.dataset[k]!==undefined);if(key)selector=`[data-${key}="${CSS.escape(button.dataset[key])}"]`;else if(['reset','swap'].includes(button.id))selector='#'+button.id;}else if(el.matches('[data-series]'))selector=`[data-series][value="${CSS.escape(el.value)}"]`;else if(el.id)selector='#'+CSS.escape(el.id);if(!selector)return;const target=other.contentDocument.querySelector(selector);if(!target)return;relaying=true;try{if(event==='click')target.click();else{target.value=el.value;if(el.type==='checkbox')target.checked=el.checked;target.dispatchEvent(new other.contentWindow.Event(event,{bubbles:true}));}}finally{relaying=false;measure();}});
new frame.contentWindow.ResizeObserver(measure).observe(doc.body);new frame.contentWindow.MutationObserver(measure).observe(doc.querySelector('#content'),{childList:true,subtree:true});measure();};frame.srcdoc=frameDocuments[index];});
</script></body></html>
