name: Dashboard checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: dashboard-without-guidelines
            route: before
          - folder: dashboard-with-guidelines
            route: after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Workbook and calculation checks
        run: |
          python -m unittest discover -s ${{ matrix.folder }}/tests -p 'test_*.py' -v
          node ${{ matrix.folder }}/tests/analysis.test.mjs
      - name: Frontend checks
        shell: bash
        run: |
          python scripts/serve_comparison.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import time, urllib.request; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8775/${{ matrix.route }}/api/data', timeout=10).read()"
          node ${{ matrix.folder }}/tests/frontend.test.mjs
